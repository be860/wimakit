services:
  - type: web
    name: wimakit-api
    runtime: docker
    dockerfilePath: backend/WiMakit.API/Dockerfile
    dockerContext: backend/WiMakit.API
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: WiMakit
      - key: Jwt__Audience
        value: WiMakit-Users
      - key: Google__ClientId
        sync: false
      - key: Smtp__Server
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__SenderEmail
        sync: false
      - key: Smtp__SenderName
        value: WiMakit
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__EnableSsl
        value: "true"
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__Bucket
        value: produce-images
      - key: Cors__AllowedOrigins__0
        value: https://wimakit.vercel.app
      - key: Cors__AllowedOrigins__1
        value: http://localhost:3000